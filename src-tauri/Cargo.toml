[package]
name = "wraith-launcher"
version = "0.0.3"
description = "Launcher for Wraith"
authors = ["ratatoskr"]
license = "MIT"
edition = "2024"
default-run = "wraith-ui"

[lib]
# `_lib` avoids a lib/bin name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wraith_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wraith-ui"
path = "src/main.rs"

# `wraith` on PATH (see src/cli.rs). Ships beside the launcher, which copies it to <root>\bin
[[bin]]
name = "wraith"
path = "src/bin/wraith.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
tauri-plugin-updater = "2.14.1"
sha2 = "0.11.1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
